# ===== Runes mode settings: end =====

# ===== Custom mode settings: start =====
[ultimate-scrapper.custom]
# Custom mode consumes the input with this chance and produces no output.
failure-chance-percent = 30

# Item level applied to every custom output (1 through 99).
item-level = 1

[ultimate-scrapper.custom.output-count-weights]
# These success-only percentages select 1 through 12 random outputs; they must sum to 100.
# These defaults create one random item and no additional random items.
one = 50
two = 25
three = 10
four = 5
five = 3
six = 2
seven = 2
eight = 1
nine = 1
ten = 1
eleven = 0
twelve = 0

# Each random output is selected independently from this list, using relative weights.
# Duplicate selections are possible. Item codes can use 1 to 4 characters;
# shorter codes are padded with spaces to the game's four-byte code field.
# Special selectors are one weighted pool entry; when chosen, a member
# is selected uniformly from that pool.
#   code = "gem"              # all sizes, including skulls
#   code = "gem:chipped"      # chipped gems and skulls only
#   code = "rune"             # El through Zod
#   code = "rune:r01-r10"     # El through Thul, inclusive
# Gem sizes: chipped, flawed, normal, flawless, perfect.
# Rune ranges are inclusive (r01 through r33). Selectors ignore case.
# Quality can be inferior, normal, superior, magic, set, rare, unique,
# or crafted. A list such as "magic,rare" chooses only those qualities.
# Blank ("") or omitted quality randomly chooses from all valid qualities.
# Set/unique quality uses a random compatible game record.
# quantity defaults to the game's normal amount, and weight defaults to 1.
# Set guaranteed = true to add one of this item to each successful recipe in
# addition to random outputs; guaranteed entries are excluded from random
# selection. Weight applies only to entries with guaranteed = false.
# Set weight to 0 to exclude an entry from random selection.

[[ultimate-scrapper.custom.items]]
code = "gem:chipped"
quality = ""
weight = 5
guaranteed = false

[[ultimate-scrapper.custom.items]]
code = "gem:flawed"
quality = ""
weight = 4
guaranteed = false

[[ultimate-scrapper.custom.items]]
code = "gem:normal"
quality = ""
weight = 3
guaranteed = false

[[ultimate-scrapper.custom.items]]
code = "gem:flawless"
quality = ""
weight = 2
guaranteed = false

[[ultimate-scrapper.custom.items]]
code = "gem:perfect"
quality = ""
weight = 1
guaranteed = false

